<!doctype html>
<!--
  AI: 新增產區時：
  1. 複製本檔到 origins/<slug>.html
  2. 把所有 {{...}} 換掉（slug、name、nameEn 要和 data/origins.js 完全一致）
  3. 不要改區塊 id 和順序、不要刪除 data-render 的空 div（由 main.js 自動渲染）
  4. 刪除所有以「AI:」開頭的 HTML 註解（包含這一段）
  5. 執行 python scripts/check.py
-->
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{name}} {{nameEn}}｜咖啡豆產區圖鑑</title>
  <meta name="description" content="{{一句話描述，可直接用 data 裡的 summary}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="origin" data-slug="{{slug}}">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">咖啡豆產區圖鑑<small>Coffee Origins</small></a>
      <nav class="nav"><a href="../index.html">產區</a><a href="../glossary.html">小辭典</a></nav>
    </div>
  </header>

  <main class="wrap">
    <div class="breadcrumb"><a href="../index.html">全部產區</a> / {{country}} / {{name}}</div>

    <section id="hero" class="origin-hero">
      <div data-render="tag"></div>
      <h1>{{name}}<span class="en">{{nameEn}}</span></h1>
      <p class="lede" data-render="summary"></p>
    </section>

    <section id="at-a-glance" class="section">
      <h2>產區速覽</h2>
      <div data-render="glance"></div>
    </section>

    <section id="story" class="section">
      <h2>產區故事</h2>
      <div class="prose">
        <!-- AI: 2–3 段，150–250 字。地理位置、歷史、這個產區為什麼有名。 -->
        <p>{{段落一}}</p>
        <p>{{段落二}}</p>
      </div>
    </section>

    <section id="terroir" class="section">
      <h2>風土與處理法</h2>
      <div class="prose">
        <!-- AI: 2 段，120–200 字。氣候、土壤、海拔如何影響風味；處理法術語連到 ../glossary.html#<id>。 -->
        <p>{{段落一，例如：多數採用<a href="../glossary.html#washed">水洗</a>……}}</p>
        <p>{{段落二}}</p>
      </div>
    </section>

    <section id="brew" class="section">
      <h2>推薦沖煮</h2>
      <div data-render="brew"></div>
    </section>

    <section id="for-you" class="section">
      <h2>適合誰喝</h2>
      <div class="prose">
        <!-- AI: 一段 50 字內 + 2–3 個條列。 -->
        <p>{{一句話}}</p>
        <ul>
          <li>{{條列一}}</li>
          <li>{{條列二}}</li>
        </ul>
      </div>
    </section>

    <section id="origin-nav" class="section">
      <div class="origin-nav" data-render="origin-nav"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">咖啡豆產區圖鑑・資料為常見範圍，實際風味依批次、烘焙與沖煮而異。</div>
  </footer>

  <script src="../data/origins.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
