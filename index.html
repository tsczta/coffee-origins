<body data-page="home">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">咖啡豆產區圖鑑<small>Coffee Origins</small></a>
      <nav class="nav"><a href="index.html" aria-current="page">產區</a><a href="glossary.html">小辭典</a></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>一杯咖啡，從哪裡來？</h1>
      <p class="lede">同樣是咖啡，衣索比亞喝起來像花茶，蘇門答臘卻像黑巧克力。這裡用一頁介紹一個產區：海拔、品種、處理法、風味分數，還有回家怎麼沖。</p>
    </section>

    <div id="filters" class="filters" role="group" aria-label="依洲別篩選"></div>
    <div id="origin-grid" class="grid"></div>

    <section class="section" style="margin-top:48px">
      <h2>怎麼看風味分數？</h2>
      <div class="prose">
        <p>每個產區都用同一套 1–5 分標準描述<a href="glossary.html#acidity">酸度</a>、<a href="glossary.html#sweetness">甜感</a>、<a href="glossary.html#body">醇厚度</a>與<a href="glossary.html#bitterness">苦韻</a>，方便橫向比較。分數代表該產區在常見烘焙度下的典型表現，實際喝到的味道仍會因批次、烘焙與沖煮而不同。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">咖啡豆產區圖鑑・資料為常見範圍，實際風味依批次、烘焙與沖煮而異。</div>
